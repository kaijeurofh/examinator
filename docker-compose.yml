# Local docker-compose setup for the Examinator web app (branch: examinator-lokal).
#
# This branch defaults to ports / image-tags / container-names that DO NOT
# collide with the OpenAI variant on `main`, so you can run both stacks side
# by side. Mapping at a glance:
#
#   main branch           : frontend 3030 / backend 8200 / project examinator
#   examinator-lokal      : frontend 3040 / backend 8210 / project examinator-lokal
#
# Usage:
#   1. cp .env.example .env  (the Ollama defaults below override anything in .env)
#   2. docker compose up --build
#   3. open http://localhost:3040 in your browser.
#
# Both host ports remain configurable via FRONTEND_PORT / BACKEND_PORT in
# case the new defaults still collide on your machine:
#
#     FRONTEND_PORT=3141 BACKEND_PORT=8211 docker compose up --build
#
# Note that NEXT_PUBLIC_API_URL is baked into the JS bundle at build time, so
# if you change BACKEND_PORT you must rebuild the frontend image
# (`docker compose build frontend`).
#
# The backend keeps job state in-process (no DB), so it is intentionally
# limited to a single worker / replica.

# Top-level project name -- pins the Compose project so this stack stays
# distinct from the `examinator` project on the main branch. Without this,
# both branches would default to the directory name and fight over the same
# network / containers when run side by side.
name: examinator-lokal

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: examinator-lokal-backend
    container_name: examinator-lokal-backend
    restart: unless-stopped
    # Pass the host-side .env straight through. Vars like OPENAI_API_KEY and
    # PYDANTIC_AI_MODEL are read by pydantic-ai inside the container. The
    # ollama-related vars below override .env defaults so this branch
    # ('examinator-lokal') runs against the local Ollama out-of-the-box.
    env_file:
      - .env
    environment:
      # The browser talks to the backend via http://<host>:${BACKEND_PORT}.
      # `EXAMINATOR_CORS_ORIGINS` is the literal allow-list; loopback names
      # are spelt out because the Origin header reflects whichever the user
      # typed into the address bar.
      EXAMINATOR_CORS_ORIGINS: "http://localhost:${FRONTEND_PORT:-3040},http://127.0.0.1:${FRONTEND_PORT:-3040}"
      # Regex fallback so VPN / LAN clients hitting the frontend via a private
      # IPv4 (e.g. http://192.168.134.40:${FRONTEND_PORT}) are not rejected by
      # CORS. Empty -> backend uses its built-in RFC1918 + loopback regex
      # (covers most VPN / LAN setups). Set to `off` to disable regex matching
      # entirely, or to a custom regex to lock the API to specific subnets.
      EXAMINATOR_CORS_ORIGIN_REGEX: ${EXAMINATOR_CORS_ORIGIN_REGEX:-}
      # --- Local LLM via Ollama (default on the examinator-lokal branch) ---
      # Switch back to OpenAI with EXAMINATOR_LLM_PROVIDER=openai in .env.
      EXAMINATOR_LLM_PROVIDER: ollama
      # host.docker.internal resolves to the Docker host. Docker Desktop on
      # Windows/Mac provides it automatically; on Linux see extra_hosts below.
      # Both vars are env-overridable so a developer who already has another
      # Ollama bound to the canonical 11434 (e.g. a different project's
      # docker-compose) can move their own Ollama to a private port via
      # OLLAMA_HOST=0.0.0.0:11435 and point us at it from `.env`.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:31b}
      # `tool` is the empirically-correct default for Gemma 4 + Ollama on
      # this stack: benchmark_local.py against a real Studienheft PDF showed
      # `prompted` mode producing no schema-valid candidate questions
      # (Gemma 4's chat template emits reasoning tokens before the inline
      # JSON, which our nested PageQuestions[T] schema rejects). The native
      # tool-call path stays clean. Override to `prompted` only if you swap
      # in a model whose template can't emit tool calls; `native` remains
      # experimental against Ollama's OpenAI-compat endpoint.
      EXAMINATOR_OUTPUT_MODE: ${EXAMINATOR_OUTPUT_MODE:-tool}
    extra_hosts:
      # No-op on Docker Desktop (Win/Mac); required on Linux so the backend
      # container can reach the host's Ollama via host.docker.internal.
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8210}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/health', timeout=2).status == 200 else sys.exit(1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client JS bundle at build time. Must point at a URL
        # the user's browser (not the container!) can reach.
        #
        # IPv4 *literal* (127.0.0.1) is deliberate: on Windows Chrome resolves
        # `localhost` to ::1 first, and Docker Desktop's port forwarder can be
        # shadowed by a foreign listener on the IPv6 loopback, producing a
        # spurious ERR_CONNECTION_REFUSED for the browser while curl over IPv4
        # works fine. Forcing 127.0.0.1 sidesteps that without disabling IPv6.
        NEXT_PUBLIC_API_URL: "http://127.0.0.1:${BACKEND_PORT:-8210}"
        # UX hint baked into the header badge so it's obvious at a glance
        # which provider/model this deployment talks to. Pulled from the same
        # env knobs the backend reads, so a `.env` override of OLLAMA_MODEL
        # automatically updates the visible badge after `docker compose build
        # frontend`. Empty values hide the badge entirely.
        NEXT_PUBLIC_LLM_PROVIDER: ${EXAMINATOR_LLM_PROVIDER:-ollama}
        NEXT_PUBLIC_LLM_MODEL: ${OLLAMA_MODEL:-gemma4:31b}
    image: examinator-lokal-frontend
    container_name: examinator-lokal-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3040}:3000"
    depends_on:
      backend:
        condition: service_healthy
