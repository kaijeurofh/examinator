# Local docker-compose setup for the Examinator web app.
#
# Usage:
#   1. cp .env.example .env  &&  edit the API keys you need.
#   2. docker compose up --build
#   3. open http://localhost:3030 in your browser
#      (or http://<host-ip>:3030 from another machine on the same LAN/VPN).
#
# Networking model
# ----------------
# The frontend container reverse-proxies `/api/*` to the backend over the
# internal docker network (`http://backend:8000`). The browser only ever
# talks to the frontend's port, which means:
#
#   - the backend port does NOT need to be exposed to the host or the LAN;
#   - the same image works from localhost, from a VPN client, or behind a
#     reverse proxy without rebuilding;
#   - same-origin requests sidestep CORS for the regular API surface.
#
# The frontend host port is configurable via FRONTEND_PORT (default 3030).
# Set BACKEND_PORT only if you also want to expose the FastAPI app directly
# for debugging (commented out below).
#
# The backend keeps job state in-process (no DB), so it is intentionally
# limited to a single worker / replica.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: examinator-backend
    container_name: examinator-backend
    restart: unless-stopped
    # Pass the host-side .env straight through. Vars like OPENAI_API_KEY and
    # PYDANTIC_AI_MODEL are read by pydantic-ai inside the container.
    env_file:
      - .env
    environment:
      # All browser traffic arrives at the FastAPI app via Next.js rewrites,
      # so requests appear to originate from the backend container itself
      # (same origin from FastAPI's perspective). We keep a permissive CORS
      # list anyway so a direct host-mapped backend port still works during
      # debugging, but in the proxied setup CORS is effectively bypassed.
      EXAMINATOR_CORS_ORIGINS: "${EXAMINATOR_CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-3030}}"
    # Backend port is intentionally NOT published by default — the frontend
    # reaches it over the docker network at `http://backend:8000`. If you
    # need to hit FastAPI directly (Swagger UI, curl debugging), uncomment:
    # ports:
    #   - "${BACKEND_PORT:-8200}:8000"
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/health', timeout=2).status == 200 else sys.exit(1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: examinator-frontend
    container_name: examinator-frontend
    restart: unless-stopped
    environment:
      # Where the Next.js server forwards `/api/*` requests. The browser
      # never sees this URL; it only routes traffic inside the docker
      # network. Override only if you split the two services across hosts.
      BACKEND_INTERNAL_URL: "http://backend:8000"
    ports:
      - "${FRONTEND_PORT:-3030}:3000"
    depends_on:
      backend:
        condition: service_healthy
