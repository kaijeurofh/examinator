[project]
name = "examinator"
version = "0.1.0"
description = "Web app to generate higher-education exam tasks (Klausur, Hausarbeit, Projekt, Einsende) with pydantic-ai."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["llm", "agents", "pydantic-ai", "uv", "education", "exam"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic-ai>=1.0,<2",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "pypdf>=5.1",
    "openpyxl>=3.1",
    "sse-starlette>=2.1",
]

[project.scripts]
examinator-serve = "examinator.__main__:main"

[project.urls]
Homepage = "https://github.com/your-org/examinator"
Issues = "https://github.com/your-org/examinator/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/examinator"]
# Ensure the PEP 561 marker ships in the wheel so downstream type checkers
# trust this package's annotations.
include = ["src/examinator/py.typed"]

# ---------------------------------------------------------------------------
# uv: package manager. Pin a uv version range here so every contributor, the
# devcontainer image, and CI all agree on which uv is doing the resolution.
# Bump the upper bound deliberately when you've validated the new uv release.
# ---------------------------------------------------------------------------
[tool.uv]
required-version = ">=0.11,<0.12"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    # FastAPI's TestClient is implemented on top of httpx; pin it explicitly so
    # the API tests do not depend on a transitive dependency staying available.
    "httpx>=0.27",
]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter. Run with `uv run ruff check` / `uv run ruff format`.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "S",   # flake8-bandit (security)
    "PL",  # pylint
    "TID", # flake8-tidy-imports
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "ANN", # flake8-annotations
]
ignore = [
    "ANN401",  # allow `Any` where it is genuinely needed
    "PLR0913", # too many arguments (agents often take many)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # asserts are fine in tests
    "ANN",     # don't require annotations in tests
    "PLR2004", # magic numbers in tests
]

[tool.ruff.lint.isort]
known-first-party = ["examinator"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy: strict static typing. Run with `uv run mypy src`.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# openpyxl ships no type stubs and `types-openpyxl` is not always available
# on PyPI for our Python pin. Treat its imports as Any so excel_export and
# its tests can opt out of strict-import errors without losing strictness
# elsewhere.
[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest. Run with `uv run pytest`.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = ["error"]
